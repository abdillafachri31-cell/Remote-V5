name: Build Arunika Remote APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Arunika-Remote-Source-GitHub.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Prepare Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Prepare Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Unzip Android project
        run: |
          mkdir -p project
          unzip -q Arunika-Remote-Source-GitHub.zip -d project
          test -f project/android/settings.gradle.kts
          test -f project/android/app/build.gradle.kts

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p project/android :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arunika-Remote-APK
          path: project/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
